format = 2

[effect]
id = "concat.hsl"
name = "HSL"
kind = "filter"
category = "Adjust"
order = 0
intensity = "red_saturation"
description = "Eight colour bands — red through magenta — each with its own hue shift, saturation and lightness, the way Jianying's HSL panel works."

# Eight bands in spectral order, matching Jianying's hsl/hsl_v1 panel: red,
# orange, yellow, green, cyan, blue, purple, magenta. Each band carries three
# signed percentages: hue in degrees (-180..180), saturation and lightness in
# percent (-100..100). All at zero is an exact identity — the shader returns
# the picture untouched — so this effect layers over the manual Adjust panel
# without fighting it.
#
# Each band's influence is a triangular window over hue: full at the band's
# centre, fading to nothing at the edges of its range. A pixel can therefore
# be touched by at most two neighbouring bands, and the bands never introduce
# a seam. The centre hues and half-widths are transcribed from Jianying's
# `DefaultAdjustBundle/hsl/HSL/xshader/fshader.frag`.
version = 1

[[param]]
key = "red_hue"
group = "Red"
label = "Red hue"
min = -180
max = 180
default = 0
step = 1
unit = "°"

[[param]]
key = "red_saturation"
group = "Red"
label = "Red saturation"
min = -100
max = 100
default = 0
step = 1
unit = "%"

[[param]]
key = "red_lightness"
group = "Red"
label = "Red lightness"
min = -100
max = 100
default = 0
step = 1
unit = "%"

