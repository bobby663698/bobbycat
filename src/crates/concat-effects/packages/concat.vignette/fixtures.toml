# A probe fills an 8x8 picture with one colour and reads back its middle
# pixel, so it can only pin the middle of the layer: at every strength,
# radius and softness the middle must stay exactly as it came, past white
# and half-transparent alike. The fall towards the corners is checked by
# the CPU twin of the shader in concat-effects/src/vignette.rs.

[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "default, a highlight past white"
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]

[[probe]]
name = "default, half transparent"
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.5, 0.2, 0.1, 0.5]

[[probe]]
name = "minimum, a highlight past white"
at = "min"
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]

[[probe]]
name = "maximum, a highlight past white"
at = "max"
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]

[[probe]]
name = "maximum, half transparent"
at = "max"
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.5, 0.2, 0.1, 0.5]

# Strength zero is the identity whatever the other two sliders say.
[[probe]]
name = "zero strength, every pixel as it came"
params = { strength = 0, radius = 100, softness = 0 }
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.5, 0.2, 0.1, 0.5]
