name: Cards

# Draws every built-in effect card on a software Vulkan adapter and uploads
# them, so a machine without a GPU to draw its own has pictures to show.
#
# The cards a shelf displays are drawn by the packages' own shaders and
# kept per machine (#416). `scripts/bundle-cards.sh` copies a machine's
# drawings into `src/crates/concat/cards/`, where the build embeds them.
# A package added without that step shows a sparkle on every machine that
# cannot draw its own, which is why `every_built_in_picture_package_ships_a_card`
# exists. This workflow is how those drawings are produced when the
# developer's machine cannot build the host (it links ONNX Runtime, which
# has no GNU target): run it, download the artifact, run
# `scripts/bundle-cards.sh <dir>`, commit the JPEGs.
#
# Manual only: a card changes when its package's shader does, which no
# schedule can know.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draw:
    name: Draw the cards
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      # The cards are drawn by a real adapter or not at all; lavapipe counts.
      CONCAT_REQUIRE_GPU: "1"
      # Keep the drawings instead of the test's scratch folder.
      CONCAT_CARDS_DIR: ${{ github.workspace }}/cards-out
      ORT_VERSION: 1.28.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (v1), 2026-10-09
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: cards
      # The same libraries the engine job installs, for the same reasons;
      # lavapipe is the point of the exercise here.
      - name: System libraries
        # Slow archive mirror, not a stuck one; see ci.yml's note. The
        # recommends are skipped for the same reason.
        timeout-minutes: 45
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgl1-mesa-dev \
            libgtk-3-dev libasound2-dev libclang-dev cmake \
            libvulkan1 mesa-vulkan-drivers
      - name: FFmpeg development libraries
        run: |
          set -euo pipefail
          scripts/ci/fetch.sh ffmpeg-linux64 ffmpeg.tar.xz
          mkdir -p ffmpeg-dev
          tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
          echo "FFMPEG_DIR=$PWD/ffmpeg-dev" >> "$GITHUB_ENV"
      - name: ONNX Runtime
        run: |
          set -euo pipefail
          stem="onnxruntime-linux-x64-$ORT_VERSION"
          scripts/ci/onnxruntime.sh linux-x64
          test -f "$stem/lib/libonnxruntime.so.$ORT_VERSION"
          ln -sf "libonnxruntime.so.$ORT_VERSION" "$stem/lib/libonnxruntime.so"
          {
            echo "ORT_LIB_LOCATION=$PWD/$stem/lib"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib:$PWD/$stem/lib"
          } >> "$GITHUB_ENV"
      - name: Draw
        working-directory: src
        run: |
          set -o pipefail
          mkdir -p "$CONCAT_CARDS_DIR"
          cargo test -p concat-host --features gpu cards::tests::every_card_draws -- --nocapture 2>&1 | tee cards.log
      - name: What was drawn
        if: always()
        run: |
          echo "cards in $CONCAT_CARDS_DIR:" || true
          ls -1 "$CONCAT_CARDS_DIR" 2>/dev/null | wc -l || true
          ls -1 "$CONCAT_CARDS_DIR" 2>/dev/null | head -20 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: effect-cards
          path: ${{ github.workspace }}/cards-out
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cards-log
          path: src/cards.log
          if-no-files-found: ignore
          retention-days: 7
