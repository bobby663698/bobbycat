# Signs a build's Windows installers with SignPath.io's free plan for open
# source: the signature chains to a CA Windows already trusts, so a person
# who downloads the setup .exe runs it without installing anything and
# without seeing "unknown publisher". The certificate belongs to SignPath
# Foundation, not to this project.
#
# Needs, once the Foundation plan accepts the project:
#
#   secret  SIGNPATH_API_TOKEN        the token from SignPath's user page
#   var     SIGNPATH_ORGANIZATION_ID  the organization's id
#   var     SIGNPATH_PROJECT_SLUG      bobbycat
#   var     SIGNPATH_POLICY_SLUG       release-signing
#   var     SIGNPATH_ARTIFACT_CONFIG   the slug of signing/signpath-artifact-config.xml
#
# Run it with the id of a finished Build app run; it downloads that run's
# windows artifact, signs the two installers, rewrites SHA256SUMS.txt over
# the signed bytes and publishes the result as windows-x86_64-signed.
name: Sign (Windows, SignPath)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of Build app whose windows artifact to sign"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  sign:
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch the unsigned installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "BobbyCat-windows-x86_64" --dir payload
          ls -l payload
          # The sums describe unsigned bytes; they are rewritten below.
          rm -f payload/SHA256SUMS.txt
          (cd payload && zip -q -r ../unsigned.zip .)
          ls -l unsigned.zip

      - name: Upload it for SignPath to take
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-for-signpath
          path: unsigned.zip

      - name: Sign
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Checksums over the signed bytes
        run: |
          set -euo pipefail
          cd signed
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -exec basename {} \; | sort |
            while read -r f; do sha256sum "$f"; done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-signed
          path: signed/*
          if-no-files-found: error
